name: Deploy to GitHub Pages

# Every push to main rebuilds and republishes the same URL. There is no
# manual "deploy" step to remember or forget — the live link always reflects
# whatever is on main, which is the whole point of wiring this up rather than
# hand-running `npm run build` and uploading a folder.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Required by actions/deploy-pages for its OIDC handshake with Pages —
  # without it the deploy job is refused even with pages: write above.
  id-token: write

# Only one deploy in flight at a time; a second push while the first is still
# building cancels the stale one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The same gate as verify.yml. A red test never reaches the live link.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run verify
      - run: npm run e2e
        env:
          CI: 'true'

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The airport dataset is committed; `verify:data` (inside verify above)
      # is the gate that keeps a bad dataset off the live site.
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
