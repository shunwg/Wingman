<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1220" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wingman" />
    <title>Wingman</title>
    <!-- Vite rebases these absolute URLs with `base` at build time, so the same
         file serves both localhost and the /Wingman/ project site. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Wingman" />
    <meta property="og:description" content="Meet people worth meeting, around the way you already travel." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta
      name="description"
      content="Meet people worth meeting, around the way you already travel."
    />
    <!-- No webfont. The interface uses the platform face (SF Pro on iPhone),
         so the first paint does not wait on a font request. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
